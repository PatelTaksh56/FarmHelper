<script>
  function switchTab(type) {
    const tabMobile = document.getElementById('btn-tab-mobile');
    const tabEmail = document.getElementById('btn-tab-email');
    const fieldMobile = document.getElementById('field-mobile');
    const fieldEmail = document.getElementById('field-email');

    if (type === 'mobile') {
      tabMobile.className = 'flex-1 py-2 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5';
      tabEmail.className = 'flex-1 py-2 rounded-lg font-label-md text-label-md transition-all duration-200 text-tertiary hover:text-on-surface flex items-center justify-center gap-1.5';
      fieldMobile.classList.remove('hidden');
      fieldEmail.classList.add('hidden');
    } else {
      tabEmail.className = 'flex-1 py-2 rounded-lg font-label-md text-label-md transition-all duration-200 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5';
      tabMobile.className = 'flex-1 py-2 rounded-lg font-label-md text-label-md transition-all duration-200 text-tertiary hover:text-on-surface flex items-center justify-center gap-1.5';
      fieldEmail.classList.remove('hidden');
      fieldMobile.classList.add('hidden');
    }
  }

  function setAuthMode(mode) {
    const modeOtp = document.getElementById('auth-mode-otp');
    const modePwd = document.getElementById('auth-mode-pwd');
    const containerPwd = document.getElementById('container-password');
    const containerOtp = document.getElementById('container-otp');

    if (mode === 'otp') {
      modeOtp.className = 'font-label-sm text-label-sm text-primary underline underline-offset-4';
      modePwd.className = 'font-label-sm text-label-sm text-tertiary hover:text-on-surface';
      containerOtp.classList.remove('hidden');
      containerPwd.classList.add('hidden');
    } else {
      modePwd.className = 'font-label-sm text-label-sm text-primary underline underline-offset-4';
      modeOtp.className = 'font-label-sm text-label-sm text-tertiary hover:text-on-surface';
      containerPwd.classList.remove('hidden');
      containerOtp.classList.add('hidden');
    }
  }

  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password-input');
    const eyeIcon = document.getElementById('eye-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }
</script></main></body></html>
